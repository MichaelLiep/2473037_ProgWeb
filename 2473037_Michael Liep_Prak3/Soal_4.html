<!DOCTYPE html>
<html>

<head>
    <title>Form Tambah Data User</title>
</head>

<body>

    <table border="1" cellspacing="0" cellpadding="20" align="center"
        style="width: 400px; margin-top: 30px; border-collapse: collapse;">
        <tr>
            <td>
                <h1 align="left" style="margin-top: 0;">Form Tambah Data User</h1>

                <form action="#">
                    <table border="0" width="100%" cellpadding="5">
                        <tr>
                            <td width="130">Name</td>
                            <td>:</td>
                            <td>
                                <input type="text" name="name" required
                                    oninvalid="this.setCustomValidity('Name is required!!!')"
                                    oninput="this.setCustomValidity('')" style="width: 90%;">
                            </td>
                        </tr>

                        <tr>
                            <td>Address</td>
                            <td>:</td>
                            <td>
                                <input type="text" name="address" required
                                    oninvalid="this.setCustomValidity('Address is required!!!')"
                                    oninput="this.setCustomValidity('')" style="width: 90%;">
                            </td>
                        </tr>

                        <tr>
                            <td>Email</td>
                            <td>:</td>
                            <td>
                                <input type="email" name="email" required oninvalid="cekEmail(this)"
                                    oninput="this.setCustomValidity('')" style="width: 90%;">
                            </td>
                        </tr>

                        <tr>
                            <td>Home Page</td>
                            <td>:</td>
                            <td><input type="url" name="homepage" style="width: 90%;"></td>
                        </tr>

                        <tr>
                            <td>Birthday</td>
                            <td>:</td>
                            <td><input type="text" name="birthday" value="hh/bb/tttt" style="width: 80%;"></td>
                        </tr>

                        <tr>
                            <td>Favorit Color</td>
                            <td>:</td>
                            <td><input type="color" name="favcolor" value="#000000"></td>
                        </tr>

                        <tr>
                            <td>IPK</td>
                            <td>:</td>
                            <td>
                                <input type="number" name="ipk" min="0" max="4" step="0.1" value="0"
                                    style="width: 60px;">
                            </td>
                        </tr>

                        <tr>
                            <td>Phone Number</td>
                            <td>:</td>
                            <td>
                                <input type="tel" name="phone" pattern="[0-9]{3}-[0-9]{7,10}" style="width: 90%;">
                            </td>
                        </tr>

                        <tr>
                            <td></td>
                            <td></td>
                            <td>
                                <input type="submit" value="Add" style="padding: 2px 15px;">
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
    </table>

    <script>
        function cekEmail(el) {
            if (el.validity.valueMissing) {
                el.setCustomValidity('Harap isi bidang ini.');
            } else if (el.validity.typeMismatch || !el.value.includes('@')) {
                el.setCustomValidity("Sertakan '@' pada alamat email ini. '" + el.value + "' tidak memiliki '@'");
            }
        }
    </script>

</body>

</html>
