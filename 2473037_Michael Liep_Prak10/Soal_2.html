<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2473037_Michael Liep Haryanto</title>
    <script src="jquery.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #ffffff;
        }

        .container {
            width: 700px;
        }

        .row-box {
            border: 1px solid #7f7f7f;
            padding: 6px 10px;
            margin-bottom: 5px;
            font-size: 16px;
            color: #000000;
            word-wrap: break-word;
            background-color: #ffffff;
        }

        #boxContent {
            min-height: 22px;
        }

        .btn-container {
            margin-top: 15px;
        }

        button {
            padding: 3px 20px;
            cursor: pointer;
            font-size: 15px;
            background-color: #e1e1e1;
            border: 1px solid #707070;
        }

        button:hover {
            background-color: #d0d0d0;
        }

        h1 {
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        h1 a {
            color: #0000ee;
            text-decoration: underline;
        }

        .item-block {
            border-top: 1px solid #000000;
            padding-top: 12px;
            margin-top: 12px;
            font-size: 15px;
            line-height: 1.4;
        }

        .item-block:first-of-type {
            border-top: none;
            margin-top: 5px;
            padding-top: 0;
        }

        .item-title {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .item-title a {
            color: #0000ee;
            text-decoration: underline;
        }

        .item-meta {
            font-style: italic;
            color: #000000;
            margin-bottom: 12px;
        }

        .item-desc {
            margin-bottom: 12px;
            text-align: justify;
        }

        .item-univ {
            margin-bottom: 4px;
        }

        .item-univ a {
            color: #0000ee;
            text-decoration: underline;
        }

        .item-tags {
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="row-box" id="boxTitle">Title</div>
        <div class="row-box" id="boxContent">Content</div>
        <div class="row-box" id="boxGenerator">Generator</div>
    </div>

    <div class="btn-container">
        <button id="btnLook">Look</button>
    </div>

    <script>
        $(document).ready(function () {
            $("#btnLook").click(function () {
                var data = {
                    "title": "Portal S1-Sistem Informasi",
                    "link": "http://si.itmaranatha.org",
                    "generator": "S1-SI FIT UKM",
                    "items": [
                        {
                            "title": "BIE02 - Pemrograman Web",
                            "link": "https://morning.maranatha.edu/course/view.php?id=4245",
                            "universitas": { "m": "http://www.itmaranatha.org/" },
                            "description": "Matakuliah ini akan mengenalkan dan mengajarkan mahasiswa tentang dasar-dasar dalam pemrograman web. Di sini mahasiswa akan mempelajari penulisan tag-tag HTML sebagai pembentuk dasar dari suatu halaman web, mahasiswa juga akan mempelajari CSS sebagai pelengkap fungsionalitas dari HTML.<br/>Selain itu mahasiswa juga akan mempelajari pemrograman web di sisi klien (client side scripting) dengan menggunakan Java Script. Dan sebagai pengenalan teknologi baru, mahasiswa juga akan mempelajari sekilas mengenai teknologi JQuery dan teknologi JSON.",
                            "published": "01-January-2023",
                            "author": "Dosen S1-SI",
                            "tags": "S1-Sistem Informasi, Pemrograman Web"
                        },
                        {
                            "title": "IS407 - Basis Data 2",
                            "link": "http://si.itmaranatha.org/index.php/is407-basis-data-2",
                            "universitas": { "m": "http://www.itmaranatha.org/" },
                            "description": "Mata kuliah ini mengajarkan kepada mahasiswa bahasa pemrograman SQL yang meliputi : Perintah SQL untuk mengambil data dari tabel dan mengurutkan data, fungsi-fungsi yang terdapat pada oracle seperti fungsi tanggal dll, Join table, Operasi DDL, DML, Constraint, Subquery, View, Index dan PL/SQL.",
                            "published": "01-January-2023",
                            "author": "Dosen S1-SI",
                            "tags": "S1-Sistem Informasi, Basis Data 2"
                        }
                    ]
                };

                var titleHtml = "<h1><a href='" + data.link + "' target='_blank'>" + data.title + "</a></h1>";
                $("#boxTitle").html(titleHtml);

                var contentHtml = "";
                $.each(data.items, function (index, item) {
                    contentHtml += "<div class='item-block'>" +
                        "<div class='item-title'><a href='" + item.link + "' target='_blank'>" + item.title + "</a></div>" +
                        "<div class='item-meta'>By : " + item.author + " / " + item.published + "</div>" +
                        "<div class='item-desc'>" + item.description + "</div>" +
                        "<div class='item-univ'>Universitas : <a href='" + item.universitas.m + "' target='_blank'>Click Here</a></div>" +
                        "<div class='item-tags'>Tag(s) : " + item.tags + "</div>" +
                        "</div>";
                });

                $("#boxContent").html(contentHtml);
                $("#boxGenerator").text("©" + data.generator);
            });
        });
    </script>
</body>

</html>
