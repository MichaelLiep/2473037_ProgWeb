<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2473037_Michael Liep Haryanto</title>
    <style>
        body {
            font-family: serif;
            padding: 20px;
        }

        .container {
            border: 1px solid #ccc;
            padding: 10px;
            width: 350px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        input[type="text"] {
            width: 200px;
            padding: 2px;
            border: 1px solid #767676;
        }

        button {
            padding: 2px 10px;
            cursor: pointer;
        }

        #name-list {
            margin-top: 10px;
        }

        .name-item {
            display: block;
            margin-bottom: 2px;
        }
    </style>
</head>

<body>

    <div class="container">
        <input type="text" id="inputName">
        <button id="btnAdd">Add</button>
        <button id="btnSearch">Search</button>

        <div id="name-list">
            <div class="name-item">John Resig</div>
            <div class="name-item">George Martin</div>
            <div class="name-item">Malcom John Sinclair</div>
            <div class="name-item">J. Ohn</div>
        </div>
    </div>

    <script src="jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#btnAdd').click(function () {
                var newName = $('#inputName').val();
                if (newName.trim() !== "") {
                    $('<div class="name-item">' + newName + '</div>').appendTo('#name-list');
                    $('#inputName').val('').focus();
                }
            });

            $('#btnSearch').click(function () {
                var searchKey = $('#inputName').val();

                $('.name-item').css('text-decoration', 'none');

                if (searchKey.trim() !== "") {
                    $('.name-item:contains("' + searchKey + '")').css('text-decoration', 'underline');
                }
            });
        });
    </script>

</body>

</html>
