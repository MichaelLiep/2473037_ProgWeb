<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2473037_Michael Liep Haryanto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: white;
            padding: 50px;
        }

        .banner {
            background-color: #AA0000;
            width: 500px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: serif;
        }

        .text-info {
            color: white;
            font-size: 60px;
            margin-right: 15px;
            display: inline-block;
        }

        .text-system {
            color: black;
            font-size: 55px;
            font-weight: normal;
            display: inline-block;
            /* Mengatur agar posisi System sedikit turun */
            transform: translateY(12px);
        }
    </style>
</head>

<body>

    <div class="banner">
        <span class="text-info">Information</span>
        <span class="text-system">System</span>
    </div>

</body>

</html>
