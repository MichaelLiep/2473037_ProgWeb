<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2473037_Michael Liep Haryanto</title>

    <style type="text/css">
        .box {
            width: 180px;
            height: 180px;
            position: relative;
            margin: auto;
        }

        .box span {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #FF0000;
        }

        .top-left {
            top: 0;
            left: 0;
            border-top: 4px solid;
            border-left: 4px solid;
        }

        .top-right {
            top: 0;
            right: 0;
            border-top: 4px solid;
            border-right: 4px solid;
        }

        .bottom-left {
            bottom: 0;
            left: 0;
            border-bottom: 4px solid;
            border-left: 4px solid;
        }

        .bottom-right {
            bottom: 0;
            right: 0;
            border-bottom: 4px solid;
            border-right: 4px solid;
        }

        .box:hover span {
            border-color: #FF00FF;
        }

        .box img {
            display: block;
            margin: auto;
            padding-top: 10px;
        }
    </style>
</head>

<body>
    <div class="box">
        <span class="top-left"></span>
        <span class="top-right"></span>
        <span class="bottom-left"></span>
        <span class="bottom-right"></span>

        <img src="src/star.jpg" width="150">
    </div>
</body>

</html>
