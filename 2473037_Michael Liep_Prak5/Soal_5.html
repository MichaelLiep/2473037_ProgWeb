<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2473037_Michael Liep Haryanto</title>

    <style>
        body {
            font-family: serif;
            padding: 50px;
        }

        ul.main-nav {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        ul.main-nav>li {
            position: relative;
            margin-right: 3px;
        }

        ul.main-nav li a {
            display: block;
            width: 120px;
            padding: 5px 0;
            text-decoration: none;
            color: black;
            text-align: center;
            background-color: white;
            border-style: dotted;
            border-color: grey;
            border-width: 2px;
        }

        ul.main-nav li a:hover {
            background-color: black;
            color: white;
        }

        ul.sub-menu {
            display: none;
            position: absolute;
            list-style: none;
            padding: 0;
            margin: 0;
            left: 0;
            top: 100%;
            z-index: 10;
        }

        ul.sub-menu li a {
            border-top: none;
        }

        ul.main-nav li:hover ul.sub-menu {
            display: block;
        }
    </style>
</head>

<body>

    <ul class="main-nav">
        <li><a href="#">Home</a></li>
        <li>
            <a href="#">News</a>
            <ul class="sub-menu">
                <li><a href="#">Sports</a></li>
                <li><a href="#">Music</a></li>
                <li><a href="#">Movie</a></li>
            </ul>
        </li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">About</a></li>
    </ul>

</body>

</html>
